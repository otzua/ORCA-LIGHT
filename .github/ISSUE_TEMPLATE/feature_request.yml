name: Feature Request
description: Propose an enhancement, new parser, or feature for Orca Light
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please keep in mind the core philosophy of Orca Light: zero external dependencies, minimal CPU/memory overhead, and native Win32 performance. Features that introduce heavy frameworks or web runtimes will not be accepted.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation? Please describe clearly.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the solution or user experience you would like to see implemented.
    validations:
      required: true

  - type: textarea
    id: performance_impact
    attributes:
      label: Performance Impact Consideration
      description: How does this feature impact cold start latency, memory working set, or background CPU usage?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
